# Netlify configuration for Divine Link

[build]
  publish = "."

# Headers for appcast.xml
[[headers]]
  for = "/appcast.xml"
  [headers.values]
    Content-Type = "application/xml"
    Cache-Control = "public, max-age=3600"

# Headers for zip downloads (only .zip files in releases folder)
[[headers]]
  for = "/releases/*.zip"
  [headers.values]
    Content-Type = "application/zip"
    Content-Disposition = "attachment"

# Headers for downloadable Bible version files (premium translations, fetched on demand)
[[headers]]
  for = "/bibles/*.sqlite"
  [headers.values]
    Content-Type = "application/octet-stream"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/bibles/catalog.json"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=300"

# Ensure HTML files are served correctly
[[headers]]
  for = "/*.html"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"

# Redirects
[[redirects]]
  from = "/download"
  to = "/download.html"
  status = 200
